services:
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: event-booking-backend
    restart: unless-stopped
    env_file:
      - ./server/.env
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGO_URL: mongodb://host.docker.internal:27017/EMS
      FRONTEND_URL: http://localhost
    ports:
      - "5000:5000"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:5000/api
    container_name: event-booking-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend