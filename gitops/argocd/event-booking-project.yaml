apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: event-booking-project
  namespace: argocd
spec:
  description: Dedicated project for the Event Booking System
  sourceRepos:
    - https://github.com/jpraveen97/event-booking-system.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: event-booking
  clusterResourceWhitelist: []
  namespaceResourceWhitelist:
    - group: apps
      kind: Deployment
    - group: ""
      kind: Service
