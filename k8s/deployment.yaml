apiVersion: apps/v1
kind: Deployment
metadata:
  name: event-booking-backend
  namespace: event-booking
spec:
  replicas: 1
  selector:
    matchLabels:
      app: event-booking-backend
  template:
    metadata:
      labels:
        app: event-booking-backend
    spec:
      containers:
        - name: backend
          image: jpraveen97/event-booking-system-backend:latest
          ports:
            - containerPort: 5000
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "5000"
            - name: MONGO_URL
              value: "mongodb://172.17.0.1:27017/EMS"
            - name: FRONTEND_URL
              value: "http://localhost:30080"
            - name: JWT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: event-booking-backend-secret
                  key: JWT_SECRET_KEY